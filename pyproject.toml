[tool.pytest.ini_options]
# Automatically instructs pytest to include 'src/' in the system search path
pythonpath = ["src"]

# --cov=package_generator tells the tool to strictly measure your source directory package
# --cov-report=term-missing prints a clean percentage table in your terminal showing missing line numbers
addopts = "--cov=package_generator --cov-report=term-missing"
